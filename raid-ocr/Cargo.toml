[package]
name = "baras-raid-ocr"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
# `query` pulls the DataFusion stack, which recognition has no use for. The app
# still enables it through its own dependency on baras-core.
baras-core = { path = "../core", default-features = false }
baras-overlay = { path = "../overlay" }

ocrs = "0.12"
# Pinned to the rten major ocrs 0.12 links against — mixing majors gives two
# incompatible copies of Model and RotatedRect.
rten = "0.24"
rten-imageproc = "0.24"

dirs = "6.0.0"
reqwest = "0.12"
sha2 = "0.10"
tracing = { workspace = true }

# Debug dumps of the crops handed to recognition.
png = "0.17"
chrono = "0.4.42"

# Lanczos-3 upscaling of the crops.
fast_image_resize = "6"

# Physical core count, for capping rten's thread pool.
num_cpus = "1"

# `malloc_trim` after a detection pass: glibc otherwise keeps every thread's
# freed tensors in its own arena.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"
